<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>CSS Transitions & Animations</title>

    <link rel="stylesheet" href="animations.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <h1>CSS Transitions & Animations</h1>
    </header>


    <!-- PRODUCT SECTION -->
    <section class="products">

        <!-- CARD 1 -->
        <div class="card fade-in">

            <!-- IMAGE -->
            <div class="image-container">
                <img src="https://picsum.photos/300/200?1" alt="">
            </div>

            <!-- CONTENT -->
            <div class="card-content">

                <h2>Laptop Gaming</h2>

                <p>
                    Hiệu năng mạnh mẽ cho game thủ.
                </p>

                <button class="btn">
                    Mua ngay
                </button>

            </div>

        </div>


        <!-- CARD 2 -->
        <div class="card fade-in">

            <div class="image-container">
                <img src="https://picsum.photos/300/200?2" alt="">
            </div>

            <div class="card-content">

                <h2>Điện thoại</h2>

                <p>
                    Camera siêu nét và pin bền.
                </p>

                <button class="btn">
                    Mua ngay
                </button>

            </div>

        </div>


        <!-- CARD 3 -->
        <div class="card fade-in">

            <div class="image-container">
                <img src="https://picsum.photos/300/200?3" alt="">
            </div>

            <div class="card-content">

                <h2>Tai nghe</h2>

                <p>
                    Âm thanh chất lượng cao.
                </p>

                <button class="btn">
                    Mua ngay
                </button>

            </div>

        </div>

    </section>


    <!-- LOADING SPINNER -->
    <section class="loading-section">

        <h2>Loading Spinner</h2>

        <div class="spinner"></div>

    </section>

</body>

</html>
