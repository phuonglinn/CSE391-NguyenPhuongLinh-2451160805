<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout E-Commerce</title>

    <link rel="stylesheet" href="grid.css">
</head>

<body>

    <!-- =========================
         MAIN GRID CONTAINER
    ========================== -->

    <div class="layout">

        <!-- HEADER -->
        <header class="header">
            E-Commerce Store
        </header>

        <!-- HERO -->
        <section class="hero">

            <div class="hero-card">
                Featured Product
            </div>

        </section>

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <h2>Filters</h2>

            <label>
                <input type="checkbox">
                Electronics
            </label>

            <label>
                <input type="checkbox">
                Fashion
            </label>

            <label>
                <input type="checkbox">
                Shoes
            </label>

            <label>
                <input type="checkbox">
                Accessories
            </label>

        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">

            <!-- PRODUCT CARD -->
            <div class="card">
                <img src="https://www.bioderma.com.vn/sites/vn/files/inline-images/serum-duong-am-8.jpg" alt="">
                <h3>Product 1</h3>
                <p>$100</p>
                <button>Buy Now</button>
            </div>

            <div class="card">
                <img src="https://www.bioderma.com.vn/sites/vn/files/inline-images/serum-duong-am-8.jpg" alt="">
                <h3>Product 2</h3>
                <p>$120</p>
                <button>Buy Now</button>
            </div>

            <div class="card">
                <img src="https://www.bioderma.com.vn/sites/vn/files/inline-images/serum-duong-am-8.jpg" alt="">
                <h3>Product 3</h3>
                <p>$130</p>
                <button>Buy Now</button>
            </div>

            <div class="card">
                <img src="https://www.bioderma.com.vn/sites/vn/files/inline-images/serum-duong-am-8.jpg" alt="">
                <h3>Product 4</h3>
                <p>$150</p>
                <button>Buy Now</button>
            </div>

            <div class="card">
                <img src="https://www.bioderma.com.vn/sites/vn/files/inline-images/serum-duong-am-8.jpg" alt="">
                <h3>Product 5</h3>
                <p>$160</p>
                <button>Buy Now</button>
            </div>

            <div class="card">
                <img src="https://www.bioderma.com.vn/sites/vn/files/inline-images/serum-duong-am-8.jpg" alt="">
                <h3>Product 6</h3>
                <p>$180</p>
                <button>Buy Now</button>
            </div>

        </main>

        <!-- ADS -->
        <aside class="ads">

            <h2>Advertisement</h2>

            <img src="https://www.bioderma.com.vn/sites/vn/files/inline-images/serum-duong-am-8.jpg" alt="Ads">

        </aside>

        <!-- FOOTER -->
        <footer class="footer">
            © 2026 E-Commerce Store
        </footer>

    </div>

</body>
</html>
