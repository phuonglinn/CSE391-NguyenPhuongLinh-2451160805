<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning Playground</title>

    <link rel="stylesheet" href="positioning.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <div class="logo">
            MyShop
        </div>

        <nav class="nav">
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Contact</a>
        </nav>

    </header>

    <!-- MAIN LAYOUT -->
    <div class="container">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <h2>Sidebar</h2>

            <ul>
                <li>Book</li>
                <li>Electronic</li>
                <li>Cosmetic</li>
                <li>Food</li>
            </ul>

        </aside>

        <!-- CONTENT -->
        <main class="content">

            <!-- PRODUCT CARD -->
            <div class="card">

                <div class="badge">
                    HOT
                </div>

                <h2>Product Card</h2>

                <p>Mẫu sản phẩm</p>

            </div>

            <!-- DUMMY CONTENT -->
            <div class="dummy-text">

                <p>Sản phẩm 1</p>
                <p>Sản phẩm 2</p>
                <p>Sản phẩm 3</p>
                <p>Sản phẩm 4</p>
                <p>Sản phẩm 5</p>
                <p>Sản phẩm 6</p>
                <p>Sản phẩm 7</p>

            </div>

        </main>

    </div>

    <!-- SCROLL TO TOP BUTTON -->
    <button class="scroll-top">
        ↑
    </button>

</body>
</html>
